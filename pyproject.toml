[project]
name = "flight-emittance-measurement"
version = "0.1.0"
description = "Emittance measurement, quadrupole scans and model training."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "torch>=2.7.1,<3",
    "scikit-learn>=1.8.0,<2",
    "machine-interfaces[epics,madx,rftrack,tao] @ git+https://gitlab.cern.ch/flight-simulator/machine-interfaces.git@1fa7fca06f949e085353030f59587a68de7e3baf",
    "flight-response-matrix @ git+https://gitlab.cern.ch/flight-simulator/response-matrix.git@7d8b2b3199e55807758e32e6c08a258b6bbbd63f"
]

[project.optional-dependencies]
atf2-examples = ["pyepics>=1.0,<4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "emittance_measurement"}, {include = "Emittance_Measurement_GUI.py"}, {include = "DatasetGenerator_ModelTrainer_EM_GUI.py"}]

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces", "response-matrix"]
