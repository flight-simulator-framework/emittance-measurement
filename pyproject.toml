[project]
name = "flight-emittance-measurement"
version = "0.2.0"
description = "Emittance measurement, quadrupole scans and model training."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "torch>=2.7.1,<3",
    "scikit-learn>=1.8.0,<2",
    "machine-interfaces>=0.2.0,<0.3",
    "flight-response-matrix>=0.2.0,<0.3",
]

[project.optional-dependencies]
clear = [
    "machine-interfaces-clear>=0.2.0,<0.3",
    "pyda (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyda-japc (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyrbac (>=1.0,<2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyccda (>=1.29.4) ; python_version >= \"3.11\" and python_version < \"4\"",
    "cmmnbuild-dep-manager (>=2.13,<3) ; python_version >= \"3.11\" and python_version < \"4\"",
]
atf2 = [
    "machine-interfaces-atf2>=0.2.0,<0.3",
]
facet2 = [
    "machine-interfaces-facet2>=0.2.0,<0.3",
]
esrf = [
    "machine-interfaces-esrf>=0.2.0,<0.3",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "emittance_measurement"}, {include = "Emittance_Measurement_GUI.py"}, {include = "DatasetGenerator_ModelTrainer_EM_GUI.py"}]

[tool.poetry.dependencies]
machine-interfaces = {source = "flight-simulator"}
flight-response-matrix = {source = "flight-simulator"}
machine-interfaces-clear = {source = "flight-simulator"}
machine-interfaces-atf2 = {source = "flight-simulator"}
machine-interfaces-facet2 = {source = "flight-simulator"}
machine-interfaces-esrf = {source = "flight-simulator"}
pyda = {source = "cern-acc-py", python = ">=3.11,<4"}
pyda-japc = {source = "cern-acc-py", python = ">=3.11,<4"}
pyrbac = {source = "cern-acc-py", python = ">=3.11,<4"}
pyccda = {source = "cern-acc-py", python = ">=3.11,<4"}
cmmnbuild-dep-manager = {source = "cern-acc-py", python = ">=3.11,<4"}
[[tool.poetry.source]]
name = "cern-acc-py"
url = "https://acc-py-repo.cern.ch/repository/vr-py-releases/simple/"
priority = "explicit"
[[tool.poetry.source]]
name = "flight-simulator"
url = "https://gitlab.cern.ch/api/v4/groups/363527/-/packages/pypi/simple/"
priority = "explicit"
[tool.flight-simulator.migration]
status = "package-registry"
